# Build + test of both apps on every push/PR. Security scanning lives in security.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main, teste-pleno]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25) lint + build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw # the wrapper may be committed from Windows without the executable bit
      # Checkstyle (lint/format, validate phase), unit + integration tests (Testcontainers) and the jar
      - name: Lint, build and test
        run: ./mvnw -B verify
        env:
          JWT_SECRET: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789
      - name: Count tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' > ../backend-counts.json
          import glob, json, xml.etree.ElementTree as ET
          t = {"total": 0, "failed": 0, "skipped": 0}
          for f in glob.glob("target/surefire-reports/TEST-*.xml") + glob.glob("target/failsafe-reports/TEST-*.xml"):
              r = ET.parse(f).getroot()
              t["total"] += int(r.get("tests", 0))
              t["failed"] += int(r.get("failures", 0)) + int(r.get("errors", 0))
              t["skipped"] += int(r.get("skipped", 0))
          print(json.dumps(t))
          PY
          cat ../backend-counts.json
          echo "### Backend tests: $(cat ../backend-counts.json)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counts-backend
          path: backend-counts.json
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/purchase-requests-*.jar
          retention-days: 7

  frontend:
    name: Frontend (React) lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formatting (Prettier)
        run: npm run format:check
      # tsc on the app (part of `npm run build`) and on the Cypress specs
      - name: Typecheck E2E specs
        run: npm run typecheck:e2e
      - name: Production build
        run: npm run build
        env:
          VITE_MOCK_BACKEND: "false"
          VITE_DEMO_LOGIN: "false"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  frontend-e2e:
    name: Frontend E2E (Cypress)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # starts Vite (mock backend) in-process and runs Cypress headless
      - name: E2E tests
        shell: bash
        run: npm run test:e2e 2>&1 | tee e2e.log
      # parses the runner's "E2E: N tests · P passed · F failed · ..." line
      - name: Count tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' > ../e2e-counts.json
          import json, re
          m = re.search(r"E2E: (\d+) tests · (\d+) passed · (\d+) failed · (\d+) pending · (\d+) skipped", open("e2e.log", errors="ignore").read())
          n = [int(x) for x in m.groups()] if m else [0, 0, 1, 0, 0]
          print(json.dumps({"total": n[0], "failed": n[2], "skipped": n[3] + n[4]}))
          PY
          cat ../e2e-counts.json
          echo "### E2E tests: $(cat ../e2e-counts.json)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counts-e2e
          path: e2e-counts.json
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore

  # Proves README §5.3: `docker compose up --build` brings up db + backend + frontend with no manual step
  # (also builds both Docker images). Smoke test goes through the frontend's nginx /api proxy.
  compose:
    name: docker compose up + smoke test + E2E (real API)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up --build
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/health | grep -q '"UP"'
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root"'
          curl -fsS http://localhost:8080/api/health | grep -q '"UP"'
          # seed user (fictional, documented in SOLUTION.md) logs in through the proxy; the token is never printed
          token=$(curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin1@kingspan.test","password":"Kingspan@123"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$token"
          curl -fsS http://localhost:8080/api/auth/me -H "Authorization: Bearer $token" | grep -q 'admin1@kingspan.test'
          curl -fsS "http://localhost:8080/api/requests?page=0&size=5" -H "Authorization: Bearer $token" | grep -q '"totalElements"'
          echo "compose smoke test passed"
      # the real frontend ↔ backend integration: Cypress drives the browser against the compose stack
      # (nginx → Spring → PostgreSQL), unlike the frontend-e2e job, which uses the in-memory fake backend
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: E2E against the real API
        working-directory: frontend
        run: npm run test:e2e:api
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-api-screenshots
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  # Publishes shields.io endpoint JSON (test counts) to GitHub Pages; the READMEs' badges read it.
  # One-time setup: Settings → Pages → Source: "GitHub Actions", and allow this branch in
  # Settings → Environments → github-pages. Until then this job is skipped-as-success (continue-on-error).
  badges:
    name: Publish test badges
    runs-on: ubuntu-latest
    needs: [backend, frontend-e2e]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/teste-pleno'
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: counts-*
          merge-multiple: true
      - name: Build badge JSON
        shell: bash
        run: |
          mkdir -p site/badges
          python3 - <<'PY'
          import json, os
          def load(f):
              try: return json.load(open(f))
              except Exception: return None
          def badge(label, c):
              if c is None: return {"schemaVersion": 1, "label": label, "message": "unknown", "color": "lightgrey"}
              passed = c["total"] - c["failed"] - c["skipped"]
              msg = f"{passed} passed" if c["failed"] == 0 else f"{c['failed']} failed, {passed} passed"
              if c["skipped"]: msg += f", {c['skipped']} skipped"
              color = "brightgreen" if c["failed"] == 0 and c["total"] > 0 else "red"
              return {"schemaVersion": 1, "label": label, "message": msg, "color": color}
          b, e = load("backend-counts.json"), load("e2e-counts.json")
          total = None if b is None or e is None else {k: b[k] + e[k] for k in ("total", "failed", "skipped")}
          for name, label, c in [("tests", "tests", total), ("backend-tests", "backend tests", b), ("e2e-tests", "e2e tests", e)]:
              json.dump(badge(label, c), open(f"site/badges/{name}.json", "w"))
              print(name, badge(label, c))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
