# Release: push a semver tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) or run manually.
# Produces a GitHub Release with the backend jar and the frontend bundle, and publishes both Docker images to GHCR.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0). Creates the tag on the selected commit."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not vX.Y.Z"; exit 1; }
      - run: chmod +x mvnw
      - name: Build and test
        run: ./mvnw -B verify
        env:
          JWT_SECRET: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789
      - name: Rename jar with the release version
        run: |
          mkdir -p ../release
          cp target/purchase-requests-*.jar "../release/purchase-requests-backend-${VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release/

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:e2e
      - run: npm run test:e2e
      - name: Production build
        run: npm run build
        env:
          VITE_MOCK_BACKEND: "false"
          VITE_DEMO_LOGIN: "false"
      - name: Package bundle
        run: |
          mkdir -p ../release
          tar -czf "../release/purchase-requests-frontend-${VERSION}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: release/

  images:
    name: Publish image (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/<repo>-backend / -frontend (metadata-action lowercases the name)
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [backend, frontend, images]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$VERSION" release/* \
            --repo "$REPO" \
            --target "$TARGET" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Docker images: \`ghcr.io/${REPO,,}-backend:${VERSION#v}\` and \`ghcr.io/${REPO,,}-frontend:${VERSION#v}\`"
