# docker compose up --build  →  Nginx gateway + frontend + backend + PostgreSQL + Redis, with no manual step.
# Every variable has a local-demo default; copy .env.example to .env to override any of them.
#
#   browser ──► gateway (Nginx, :8080) ──┬─ /                 ─► frontend (static SPA)
#                                        ├─ /api/*            ─► backend  (/api prefix stripped)
#                                        └─ /health, /docs    ─► backend
#   backend ──► db (PostgreSQL: data) and redis (JWT sessions, ADR-015)
#
# Only the gateway is published (http://localhost:8080); backend, frontend and Redis are reachable only inside
# the compose network. PostgreSQL is also published on 127.0.0.1 for a locally run backend.
name: purchase-requests

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: purchase
      POSTGRES_USER: ${DB_USER:-purchase}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-purchase}
    volumes:
      - db-data:/var/lib/postgresql/data
    # loopback only: lets a locally run backend (./mvnw spring-boot:run) use it; never reachable from the network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d purchase"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # JWT sessions (ADR-015): one key per issued token, expiring with it. Internal only, never published.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"] # sessions are short-lived; a restart = log in again
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The backend refuses to start without a strong JWT_SECRET (SEC-F13) and none is committed. If .env does not
  # set one, a random 48-byte secret is generated once and kept in a volume (tokens survive restarts).
  jwt-secret:
    image: alpine:3.21
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - jwt-secret:/secrets
    command:
      - sh
      - -c
      - |
        set -e
        umask 077
        if [ -n "$$JWT_SECRET" ]; then printf '%s' "$$JWT_SECRET" > /secrets/jwt
        elif [ ! -s /secrets/jwt ]; then head -c 48 /dev/urandom | base64 | tr -d '\n' > /secrets/jwt
        fi
        chown 10001 /secrets/jwt
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jwt-secret:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://db:5432/purchase
      DB_USER: ${DB_USER:-purchase}
      DB_PASSWORD: ${DB_PASSWORD:-purchase}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ISSUER: ${JWT_ISSUER:-purchase-requests}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-purchase-requests-api}
      JWT_TTL: ${JWT_TTL:-PT15M}
      PORT: "3000"
      SEED_ENABLED: ${SEED_ENABLED:-true}
      LOGIN_MAX_FAILURES_PER_ACCOUNT: ${LOGIN_MAX_FAILURES_PER_ACCOUNT:-5}
      LOGIN_MAX_FAILURES_PER_CLIENT: ${LOGIN_MAX_FAILURES_PER_CLIENT:-50}
      LOGIN_THROTTLE_WINDOW: ${LOGIN_THROTTLE_WINDOW:-PT15M}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-1MB}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    volumes:
      - jwt-secret:/secrets:ro
    # same command as the image's ENTRYPOINT, with JWT_SECRET read from the generated file
    entrypoint:
      - sh
      - -c
      - JWT_SECRET="$$(cat /secrets/jwt)" exec java -XX:MaxRAMPercentage=75 -jar /app/app.jar
    # not published: HTTP reaches it only through the gateway
    healthcheck:
      # the JRE image has no curl/wget: plain HTTP over bash's /dev/tcp. Healthy = HTTP 200, i.e. the overall
      # status is UP (database + Redis) AND the app is ready (the demo seed has finished; it is OUT_OF_SERVICE,
      # 503, while the seed runs). Matching "UP" in the body is not enough: a component can be UP while the
      # application is not.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/3000
          && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MOCK_BACKEND: "false"
        # Demo stack: the login form comes pre-filled with the main seed user (admin1) and offers the seed-user
        # picker. VITE_DEMO_LOGIN=false turns both off; production builds outside compose keep them off (SEC-F04).
        VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-true}
    environment:
      BACKEND_URL: http://backend:3000 # used only when the image runs alone; in compose /api goes via the gateway
    # not published: served through the gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Nginx reverse proxy: the single HTTP entry point (ADR-016). Config inline below (`configs: gateway-conf`).
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    configs:
      - source: gateway-conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  jwt-secret:

# `$$` is a literal `$` for Nginx (Compose interpolates `${...}` in this file); ${GATEWAY_LOGIN_RATE} is Compose's.
configs:
  gateway-conf:
    content: |
      # Edge rate limit for the login endpoint, per client IP. The backend keeps its own per-account and
      # per-client limits (SEC-F01); behind the gateway the backend sees the gateway's address, so this is
      # where per-IP limiting happens.
      limit_req_zone $$binary_remote_addr zone=login:10m rate=${GATEWAY_LOGIN_RATE:-30r/m};
      limit_req_status 429;

      # keep the caller's X-Request-Id or create one (the backend validates it and echoes it back)
      map $$http_x_request_id $$req_id {
          ""      $$request_id;
          default $$http_x_request_id;
      }

      upstream backend  { server backend:3000;  keepalive 16; }
      upstream frontend { server frontend:8080; keepalive 8; }

      server {
          listen 8080;
          server_tokens off;
          client_max_body_size 1m;   # same limit as the backend (MAX_REQUEST_BODY)

          gzip on;
          gzip_types application/json application/problem+json application/javascript text/css image/svg+xml;

          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
          add_header Referrer-Policy "no-referrer" always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $$http_host;          # keeps host:port, so backend redirects (Swagger) stay valid
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Request-Id $$req_id;
          proxy_connect_timeout 5s;
          proxy_read_timeout 30s;

          location = /gateway-health { access_log off; default_type text/plain; return 200 "ok"; }

          # API: /api/x → backend /x (same contract as the Vite dev proxy)
          location = /api/auth/login {
              limit_req zone=login burst=20 nodelay;
              proxy_pass http://backend/auth/login;
          }
          location /api/ { proxy_pass http://backend/; }

          # operations and OpenAPI, unprefixed
          location = /health      { proxy_pass http://backend; }
          location /docs          { proxy_pass http://backend; }
          location /swagger-ui/   { proxy_pass http://backend; }
          location /v3/api-docs   { proxy_pass http://backend; }

          # everything else: the SPA
          location / { proxy_pass http://frontend; }
      }
